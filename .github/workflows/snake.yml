name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Aaron-Mendonca
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Add initial pause to snake animation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          PAUSE = "5s"

          files = [
              Path("dist/github-contribution-grid-snake.svg"),
              Path("dist/github-contribution-grid-snake-dark.svg"),
          ]

          for file in files:
              text = file.read_text(encoding="utf-8")

              # Delay only animations that start immediately.
              # Chained animations such as "previous.end" are left untouched.
              text = text.replace('begin="0s"', f'begin="{PAUSE}"')
              text = text.replace('begin="0"', f'begin="{PAUSE}"')

              file.write_text(text, encoding="utf-8")

              print(f"Initial pause added to {file}")

          PY

      - name: Publish snake files
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

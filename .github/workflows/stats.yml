name: Update README cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Aaron-Mendonca&show_icons=true&theme=tokyonight&hide_border=true&card_width=480
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Aaron-Mendonca&layout=compact&langs_count=6&theme=tokyonight&hide_border=true&card_width=480
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make both cards the same size
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          WIDTH = 480
          HEIGHT = 200

          for filename in [
              "profile/stats.svg",
              "profile/top-langs.svg"
          ]:
              path = Path(filename)
              svg = path.read_text()

              svg = re.sub(
                  r'<svg\b[^>]*>',
                  f'<svg width="{WIDTH}" height="{HEIGHT}" viewBox="0 0 {WIDTH} {HEIGHT}" preserveAspectRatio="none">',
                  svg,
                  count=1
              )

              path.write_text(svg)
          PY

      - name: Check generated files
        run: |
          echo "Generated files:"
          ls -lh profile/

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          git commit -m "Update GitHub analytics cards" || echo "No changes to commit"

          git push

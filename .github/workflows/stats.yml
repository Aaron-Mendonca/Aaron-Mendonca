name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download GitHub Stats
        run: |
          mkdir -p profile

          curl -L "https://github-readme-stats.vercel.app/api?username=Aaron-Mendonca&show_icons=true&theme=tokyonight&hide_border=true" \
            -o profile/stats.svg

          curl -L "https://github-readme-stats.vercel.app/api/top-langs/?username=Aaron-Mendonca&layout=compact&langs_count=6&theme=tokyonight&hide_border=true" \
            -o profile/top-langs.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git commit -m "Update GitHub analytics cards" || exit 0

          git push

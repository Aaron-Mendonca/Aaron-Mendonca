name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile folder
        run: mkdir -p profile

      - name: Generate GitHub Stats
        run: |
          curl -L "https://github-readme-stats.vercel.app/api?username=Aaron-Mendonca&show_icons=true&theme=tokyonight&hide_border=true" \
          -o profile/stats.svg

      - name: Generate Top Languages
        run: |
          curl -L "https://github-readme-stats.vercel.app/api/top-langs/?username=Aaron-Mendonca&layout=compact&langs_count=6&theme=tokyonight&hide_border=true" \
          -o profile/top-langs.svg

      - name: Check generated files
        run: |
          ls -lh profile/
          head -c 100 profile/stats.svg
          echo
          head -c 100 profile/top-langs.svg

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          git commit -m "Update GitHub analytics cards" || echo "No changes to commit"

          git push
